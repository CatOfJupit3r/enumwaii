name: Bug report
description: Report reproducible incorrect behavior in a published package.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Search existing issues first and do not disclose security vulnerabilities here.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - enumwaii
        - eslint-plugin-enumwaii
        - Documentation or examples
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.x.x
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, TypeScript, ESLint, package manager, and framework versions that matter.
      placeholder: Node 22, TypeScript 6.0, pnpm 11, Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a small repository or provide complete code and commands that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the complete diagnostic or stack trace when relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add configuration, screenshots, benchmarks, or related links that help explain the issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
