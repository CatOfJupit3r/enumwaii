version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Renovate owns routine version updates. Keep this entry so Dependabot can
    # continue opening pull requests for security alerts.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Renovate owns routine version updates. Keep this entry so Dependabot can
    # continue opening pull requests for security alerts.
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
