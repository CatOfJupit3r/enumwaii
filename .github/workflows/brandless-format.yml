name: Format brandless experiments

on:
  push:
    branches: [research/brandless-native-literals-v2]
    paths:
      - .github/workflows/brandless-format.yml
      - packages/eslint-plugin-enumwaii/test/brandless-investigation.test.ts
      - packages/eslint-plugin-enumwaii/test/brandless-investigation/**

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brandless-native-literals-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/eslint-plugin-enumwaii/test/brandless-investigation.test.ts
          packages/eslint-plugin-enumwaii/test/brandless-investigation/harness.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/eslint-plugin-enumwaii/test/brandless-investigation.test.ts
          git add packages/eslint-plugin-enumwaii/test/brandless-investigation/harness.ts
          git commit -m "chore: format brandless investigation"
          git push origin HEAD:research/brandless-native-literals-v2
