name: Format brandless investigation README

on:
  push:
    branches: [research/brandless-native-literals-v2]
    paths:
      - .github/workflows/brandless-format.yml
      - experiments/brandless-v2/README.md

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brandless-native-literals-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write experiments/brandless-v2/README.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/brandless-v2/README.md
          git commit -m "chore: format brandless investigation readme"
          git push origin HEAD:research/brandless-native-literals-v2
