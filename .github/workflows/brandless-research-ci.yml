name: Brandless research CI

on:
  push:
    branches:
      - research/brandless-native-literal-api

permissions:
  contents: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated research matrix
        shell: bash
        run: |
          set -uo pipefail
          results_dir="experiments/brandless-research/results"
          rm -rf "$results_dir"
          mkdir -p "$results_dir"
          : > "$results_dir/status.tsv"

          run_capture() {
            local name="$1"
            shift
            set +e
            "$@" > "$results_dir/$name.log" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\n' "$name" "$status" >> "$results_dir/status.tsv"
          }

          run_capture typescript-version pnpm exec tsc --version
          run_capture experiment-types pnpm exec tsc -p experiments/brandless-research/tsconfig.json --pretty false
          run_capture provenance-tests pnpm --filter eslint-plugin-enumwaii exec vitest run test/brandless-research.test.ts --reporter=verbose
          run_capture runtime-tests pnpm --filter eslint-plugin-enumwaii exec vitest run test/brandless-runtime.test.ts --reporter=verbose
          run_capture performance-tests pnpm --filter eslint-plugin-enumwaii exec vitest run test/brandless-performance.test.ts --reporter=verbose
          run_capture perf-branded pnpm exec tsc -p experiments/brandless-research/perf/tsconfig.branded.json --extendedDiagnostics --pretty false
          run_capture perf-brandless pnpm exec tsc -p experiments/brandless-research/perf/tsconfig.brandless.json --extendedDiagnostics --pretty false
          run_capture perf-native-carrier pnpm exec tsc -p experiments/brandless-research/perf/tsconfig.native-carrier.json --extendedDiagnostics --pretty false
          run_capture perf-native-enum pnpm exec tsc -p experiments/brandless-research/perf/tsconfig.native-enum.json --extendedDiagnostics --pretty false
          run_capture repository-check pnpm check

          {
            echo '# TypeScript 6 brandless research results'
            echo
            echo 'Generated by the self-removing branch workflow against the repository lockfile and toolchain.'
            echo
            echo '## Status'
            echo
            echo '| Command | Exit code |'
            echo '| --- | ---: |'
            while IFS=$'\t' read -r name status; do
              printf '| `%s` | %s |\n' "$name" "$status"
            done < "$results_dir/status.tsv"
            echo
            echo '## TypeScript version'
            echo
            echo '```text'
            cat "$results_dir/typescript-version.log"
            echo '```'
            echo
            echo '## TypeScript extended diagnostics'
            for name in perf-branded perf-brandless perf-native-carrier perf-native-enum; do
              echo
              printf '### `%s`\n\n' "$name"
              echo '```text'
              grep -E '^(Files|Lines of Library|Lines of TypeScript|Identifiers|Symbols|Types|Instantiations|Memory used|Parse time|Bind time|Check time|Emit time|Total time):' "$results_dir/$name.log" || cat "$results_dir/$name.log"
              echo '```'
            done
            echo
            echo '## Machine-readable performance markers'
            echo
            echo '```text'
            grep -hE 'BRANDLESS_(TS|LINT)_PERF' "$results_dir"/*.log || true
            echo '```'
            echo
            echo 'Raw command output is retained beside this report.'
          } > "$results_dir/README.md"

          git rm .github/workflows/brandless-research-ci.yml
          git add "$results_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: refresh TypeScript 6 brandless research results"
          git push origin "HEAD:${GITHUB_REF_NAME}"
