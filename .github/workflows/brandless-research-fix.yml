name: Apply brandless research fixes

on:
  push:
    branches:
      - research/brandless-native-literal-api

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch isolated research files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fixture = Path("packages/eslint-plugin-enumwaii/test/fixtures/brandless-research/definitions.ts")
          text = fixture.read_text()
          text = text.replace(
              'export function replaceOwnedWithRaw(_role: Role): "ADMIN" {\n  return "ADMIN";\n}',
              'export function replaceOwnedWithRaw(_role: Role): "ADMIN" {\n  return "ADMIN"; // expect:raw\n}',
          )
          fixture.write_text(text)

          carrier = Path("experiments/brandless-research/native-carrier.fixture.ts")
          text = carrier.read_text()
          text = text.replace(
              "void labels;\nvoid returnOwned;",
              "void labels;\nvoid badHolder;\nvoid returnOwned;",
          )
          carrier.write_text(text)

          analyzer = Path("experiments/brandless-research/provenance-analyzer.ts")
          text = analyzer.read_text()
          text = text.replace(
              """        const identity = this.#identityFromTypeNode(declaration.type);\n        if (\n          identity &&\n          (declaration.getSourceFile().isDeclarationFile ||\n            (ts.isVariableDeclaration(declaration) &&\n              declaration.initializer === undefined))\n        ) {\n          return this.#ownedValue(type, identity);\n        }\n""",
              """        const identity = this.#identityFromTrustedDeclarationTypeNode(\n          declaration.type,\n        );\n        if (\n          identity &&\n          (declaration.getSourceFile().isDeclarationFile ||\n            (ts.isVariableDeclaration(declaration) &&\n              declaration.initializer === undefined))\n        ) {\n          return this.#ownedValue(type, identity);\n        }\n""",
          )
          needle = """  #identityExpectedFromExpression(\n    expression: ts.Expression,\n  ): string | undefined {\n"""
          helper = """  #identityFromTrustedDeclarationTypeNode(\n    node: ts.TypeNode,\n  ): string | undefined {\n    const unwrapped = ts.isParenthesizedTypeNode(node) ? node.type : node;\n    if (\n      !ts.isTypeReferenceNode(unwrapped) &&\n      !ts.isTypeQueryNode(unwrapped) &&\n      !ts.isIndexedAccessTypeNode(unwrapped) &&\n      !ts.isConditionalTypeNode(unwrapped)\n    ) {\n      return undefined;\n    }\n    return this.#identityFromTypeNode(unwrapped);\n  }\n\n"""
          if helper not in text:
              text = text.replace(needle, helper + needle)
          analyzer.write_text(text)
          PY

          pnpm exec prettier --write \
            experiments/brandless-research \
            packages/eslint-plugin-enumwaii/test/brandless-performance.test.ts \
            packages/eslint-plugin-enumwaii/test/brandless-research-rule.ts \
            packages/eslint-plugin-enumwaii/test/brandless-research.test.ts \
            packages/eslint-plugin-enumwaii/test/brandless-runtime.test.ts \
            packages/eslint-plugin-enumwaii/test/fixtures/brandless-research

          git rm .github/workflows/brandless-research-fix.yml
          git add experiments/brandless-research packages/eslint-plugin-enumwaii/test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: fix and format brandless research fixtures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
