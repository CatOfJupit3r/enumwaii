name: Check Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "**/skills/**"
      - "_artifacts/**"
      - "**/_artifacts/**"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate intent skills
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Validate dependency pins
        run: node scripts/check-dependency-pins.mjs

      - name: Install pinned intent
        run: >-
          pnpm install --frozen-lockfile
          --filter enumwaii-workspace
          --filter enumwaii

      - name: Validate skills
        run: pnpm --filter enumwaii exec intent validate skills --github-summary

  review:
    name: Check intent skill coverage
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Validate dependency pins
        run: node scripts/check-dependency-pins.mjs

      - name: Install pinned intent
        run: >-
          pnpm install --frozen-lockfile
          --filter enumwaii-workspace
          --filter enumwaii

      - name: Check skills
        id: stale
        run: pnpm --filter enumwaii exec intent stale --github-review --package-label "enumwaii"

      - name: Open or update review PR
        if: steps.stale.outputs.has_review == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: skills/review
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
            git commit --allow-empty -m "chore: review intent skills"
            git push origin "$BRANCH"
          fi

          PR_URL="$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body-file pr-body.md
          else
            gh pr create \
              --title "Review intent skills" \
              --body-file pr-body.md \
              --head "$BRANCH" \
              --base "$BASE_BRANCH"
          fi
