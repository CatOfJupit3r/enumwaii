name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Core validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Validate dependency pins
        run: node scripts/check-dependency-pins.mjs
      - name: Install core dependencies
        run: >-
          pnpm install --frozen-lockfile --filter enumwaii-workspace --filter enumwaii --filter eslint-plugin-enumwaii
      - run: pnpm check:core

  extended:
    name: Extended validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Validate dependency pins
        run: node scripts/check-dependency-pins.mjs
      - run: pnpm install --frozen-lockfile
      - name: Check packages, examples, and documentation
        run: pnpm check
      - name: Check Bun and Cloudflare Workers
        run: pnpm test:runtimes
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.20.8
      - name: Check the minimum supported Node major
        run: node scripts/check-node18-runtime.mjs
