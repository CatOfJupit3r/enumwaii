name: Documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - packages/**/*.ts
      - packages/**/package.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter enumwaii-docs build
        env:
          PAGES_BASE_PATH: /enumwaii
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
