name: Documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - packages/**/*.ts
      - packages/**/package.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: actions/configure-pages@v6.0.0
        with:
          static_site_generator: next
      - name: Validate dependency pins
        run: node scripts/check-dependency-pins.mjs
      - name: Install documentation dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter enumwaii-workspace
          --filter enumwaii-docs
          --filter enumwaii
          --filter eslint-plugin-enumwaii
      - run: pnpm --filter enumwaii-docs build
        env:
          PAGES_BASE_PATH: /enumwaii
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
