name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: npm-release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
      - name: Validate dependency pins
        run: node scripts/check-dependency-pins.mjs
      - name: Install release dependencies
        run: >-
          pnpm install --frozen-lockfile --filter enumwaii-workspace --filter enumwaii --filter eslint-plugin-enumwaii
      - run: pnpm check:core
      - uses: changesets/action@v2.1.1
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
