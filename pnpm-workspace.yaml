packages:
  - docs
  - packages/*

savePrefix: ""
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Add only reviewed, exact selectors (for example, package@1.2.3) when an
# emergency update must bypass the 24-hour quarantine.
minimumReleaseAgeExclude: []
blockExoticSubdeps: true
strictDepBuilds: true

allowBuilds:
  "esbuild@0.28.2": true

overrides:
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  undici@>=8.0.0 <8.10.2: 8.10.2
